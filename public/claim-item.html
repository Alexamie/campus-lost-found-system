<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Claim Item</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container">
    <a class="navbar-brand" href="index.html">🎒 Campus Lost & Found</a>
  </div>
</nav>

<div class="container page-container my-5">

  <h2 class="mb-4">Claim Item</h2>

  <form class="shadow p-4 rounded bg-light" id="claimForm">

    <div class="mb-3">
      <label for="foundItemSelect" class="form-label">Select Found Item to Claim</label>
      <select class="form-select" id="foundItemSelect" required>
        <option value="" selected disabled>Choose a found item...</option>
        <!-- Options will be populated by JavaScript -->
      </select>
    </div>

    <div class="mb-3">
      <label for="claimerName" class="form-label">Your Name</label>
      <input type="text" class="form-control" id="claimerName" placeholder="Your full name" required>
    </div>

    <div class="mb-3">
      <label for="claimerContact" class="form-label">Contact Info</label>
      <input type="text" class="form-control" id="claimerContact" placeholder="Phone or Email" required>
    </div>

    <button type="submit" class="btn btn-primary">Submit Claim</button>

  </form>

</div>

<script src="script.js"></script>

</body>
</html>
