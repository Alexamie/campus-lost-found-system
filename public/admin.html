<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Dashboard</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container">
    <a class="navbar-brand" href="index.html">🎒 Campus Lost & Found</a>
  </div>
</nav>

<div class="container page-container my-5">
  <h2 class="mb-4">Admin Dashboard</h2>

  <div class="row">
    <div class="col-md-6">
      <h3>Manage Users</h3>
      <button id="loadUsers" class="btn btn-primary mb-3">Load Users</button>
      <ul id="usersList" class="list-group"></ul>
    </div>
    <div class="col-md-6">
      <h3>Add User</h3>
      <form id="addUserForm">
        <div class="mb-3">
          <label>Name</label>
          <input type="text" id="userName" class="form-control" required>
        </div>
        <div class="mb-3">
          <label>Email</label>
          <input type="email" id="userEmail" class="form-control" required>
        </div>
        <div class="mb-3">
          <label>Password</label>
          <input type="password" id="userPassword" class="form-control" required>
        </div>
        <div class="mb-3">
          <label>Role</label>
          <select id="userRole" class="form-control">
            <option value="user">User</option>
            <option value="admin">Admin</option>
          </select>
        </div>
        <button type="submit" class="btn btn-success">Add User</button>
      </form>
    </div>
  </div>

  <div class="row mt-5">
    <div class="col-12">
      <h3>Moderate Item Posts</h3>
      <button id="loadItems" class="btn btn-primary mb-3">Load Posts</button>
      <div id="itemsList" class="list-group"></div>
    </div>
  </div>
</div>

<script src="script.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
  const token = localStorage.getItem('token');

  async function apiCall(url, options = {}) {
    const response = await fetch(url, {
      ...options,
      headers: {
        ...(options.headers || {}),
        'Authorization': `Bearer ${token}`
      }
    });

    const text = await response.text();
    const data = text ? JSON.parse(text) : null;

    if (!response.ok) {
      throw new Error((data && data.message) || 'Request failed');
    }

    return data;
  }

  document.getElementById('loadUsers').addEventListener('click', async () => {
    try {
      const users = await apiCall('/admin/users');
      const list = document.getElementById('usersList');
      list.innerHTML = '';
      users.forEach(user => {
        const li = document.createElement('li');
        li.className = 'list-group-item d-flex justify-content-between align-items-center';
        li.textContent = `${user.name} (${user.email}) - ${user.role}`;
        const deleteBtn = document.createElement('button');
        deleteBtn.className = 'btn btn-danger btn-sm';
        deleteBtn.textContent = 'Delete';
        deleteBtn.onclick = async () => {
          await apiCall(`/admin/users/${user.id}`, { method: 'DELETE' });
          li.remove();
        };
        li.appendChild(deleteBtn);
        list.appendChild(li);
      });
    } catch (error) {
      alert('Error loading users');
    }
  });

  // Add user
  document.getElementById('addUserForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const name = document.getElementById('userName').value;
    const email = document.getElementById('userEmail').value;
    const password = document.getElementById('userPassword').value;
    const role = document.getElementById('userRole').value;

    try {
      await apiCall('/admin/users', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ name, email, password, role })
      });

      alert('User added');
      document.getElementById('addUserForm').reset();
    } catch (error) {
      alert(error.message || 'Error adding user');
    }
  });

  document.getElementById('loadItems').addEventListener('click', async () => {
    try {
      const items = await apiCall('/admin/items');
      const list = document.getElementById('itemsList');
      list.innerHTML = '';

      if (!items.length) {
        list.innerHTML = '<div class="list-group-item">No posts found.</div>';
        return;
      }

      items.forEach(item => {
        const wrapper = document.createElement('div');
        wrapper.className = 'list-group-item';
        wrapper.innerHTML = `
          <div class="d-flex justify-content-between align-items-start gap-3">
            <div>
              <h5 class="mb-1">${item.title}</h5>
              <p class="mb-1">${item.description}</p>
              <small>Status: ${item.status} | Approval: ${item.approvalStatus} | Contact: ${item.contact}</small>
            </div>
            <div class="d-flex gap-2">
              ${item.approvalStatus === 'pending' ? '<button class="btn btn-success btn-sm approve-btn">Approve</button>' : ''}
              <button class="btn btn-danger btn-sm delete-btn">Delete</button>
            </div>
          </div>
        `;

        const approveBtn = wrapper.querySelector('.approve-btn');
        if (approveBtn) {
          approveBtn.addEventListener('click', async () => {
            await apiCall(`/admin/items/${item.id}/approve`, { method: 'PATCH' });
            document.getElementById('loadItems').click();
          });
        }

        wrapper.querySelector('.delete-btn').addEventListener('click', async () => {
          await apiCall(`/admin/items/${item.id}`, { method: 'DELETE' });
          wrapper.remove();
        });

        list.appendChild(wrapper);
      });
    } catch (error) {
      alert(error.message || 'Error loading posts');
    }
  });
});
</script>
</body>
</html>
