<!DOCTYPE html>
<html>
<head>
  <title>Campus Lost & Found Admin</title>

  <style>
    body {
      font-family: Arial;
      padding: 20px;
      background: #f4f6f9;
    }

    h1 {
      color: #2c3e50;
    }

    .badge {
      padding: 5px 10px;
      border-radius: 5px;
      color: white;
      font-size: 12px;
    }

    .lost { background: #e74c3c; }
    .found { background: #27ae60; }
    .pending { background: #f39c12; }
    .approved { background: #2ecc71; }
    .returned { background: #3498db; }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      margin-top: 20px;
    }

    th, td {
      padding: 12px;
      border: 1px solid #ddd;
      text-align: center;
    }

    th {
      background: #34495e;
      color: white;
    }

    button {
      padding: 5px 8px;
      margin: 2px;
      border: none;
      cursor: pointer;
      border-radius: 4px;
    }

    .btn-approve { background: #2ecc71; color: white; }
    .btn-return { background: #3498db; color: white; }
    .btn-delete { background: #e74c3c; color: white; }

    .dashboard {
      display: flex;
      gap: 15px;
      margin-bottom: 20px;
    }

    .card {
      flex: 1;
      background: white;
      padding: 15px;
      border-radius: 8px;
      text-align: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    .card h2 {
      margin: 0;
      color: #2c3e50;
    }
  </style>
</head>

<body>

<h1>🎓 Campus Lost & Found Admin Panel</h1>

<!-- DASHBOARD STATS -->
<div class="dashboard">
  <div class="card">
    <h2 id="totalReports">0</h2>
    <p>Total Reports</p>
  </div>

  <div class="card">
    <h2 id="pendingReports">0</h2>
    <p>Pending</p>
  </div>

  <div class="card">
    <h2 id="approvedReports">0</h2>
    <p>Approved</p>
  </div>
</div>

<!-- TABLE -->
<table id="reportsTable">
  <thead>
    <tr>
      <th>ID</th>
      <th>Title</th>
      <th>Type</th>
      <th>Status</th>
      <th>Location</th>
      <th>Contact</th>
      <th>Date</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<script>

// ======================
// LOAD REPORTS
// ======================
async function loadReports() {
  try {
    const token = JSON.parse(localStorage.getItem("session"))?.token;
    if (!token) {
      window.location.href = "login.html";
      return;
    }

    const response = await fetch('/items', {
      headers: {
        'Authorization': `Bearer ${token}`
      }
    });

    if (!response.ok) {
      throw new Error('Failed to load reports');
    }

    const data = await response.json();

    const table = document.querySelector('#reportsTable tbody');
    table.innerHTML = '';

    let total = data.length;
    let pending = 0;
    let approved = 0;

    data.forEach(r => {
      // Count statuses
      if (r.status === 'pending') pending++;
      if (r.status === 'approved') approved++;

      table.innerHTML += `
        <tr>
          <td>${r.id}</td>
          <td>${r.title}</td>
          <td>
            <span class="badge ${r.type}">
              ${r.type}
            </span>
          </td>
          <td>
            <span class="badge ${r.status}">
              ${r.status}
            </span>
          </td>
          <td>${r.location}</td>
          <td>${r.contact}</td>
          <td>${new Date(r.createdAt).toLocaleDateString()}</td>
          <td>
            <button class="btn-approve" onclick="updateStatus(${r.id}, 'approved')">Approve</button>
            <button class="btn-return" onclick="updateStatus(${r.id}, 'returned')">Return</button>
            <button class="btn-delete" onclick="deleteReport(${r.id})">Delete</button>
          </td>
        </tr>
      `;
    });

    // update dashboard stats
    document.getElementById('totalReports').innerText = total;
    document.getElementById('pendingReports').innerText = pending;
    document.getElementById('approvedReports').innerText = approved;
  } catch (error) {
    console.error('Error loading reports:', error);
    alert('Failed to load reports');
  }
}


// ======================
// UPDATE STATUS
// ======================
async function updateStatus(id, status) {
  try {
    const token = JSON.parse(localStorage.getItem("session"))?.token;
    if (!token) {
      window.location.href = "login.html";
      return;
    }

    // TODO: Implement update endpoint in backend
    alert(`Update status to ${status} - Backend endpoint needed`);
    loadReports();
  } catch (error) {
    console.error('Error updating status:', error);
    alert('Failed to update status');
  }
}


// ======================
// DELETE REPORT
// ======================
async function deleteReport(id) {
  if (!confirm('Delete this report?')) return;

  try {
    const token = JSON.parse(localStorage.getItem("session"))?.token;
    if (!token) {
      window.location.href = "login.html";
      return;
    }

    // TODO: Implement delete endpoint in backend
    alert('Delete report - Backend endpoint needed');
    loadReports();
  } catch (error) {
    console.error('Error deleting report:', error);
    alert('Failed to delete report');
  }
}


// ======================
// AUTO LOAD & AUTH CHECK
// ======================
const session = JSON.parse(localStorage.getItem("session"));
const user = session?.user;

if (!user) {
  window.location.href = "login.html";
} else if (String(user.role || '').toLowerCase() !== 'admin') {
  alert('Access denied. Admin privileges required.');
  window.location.href = "user-dashboard.html";
} else {
  loadReports();
} 

</script>

</body>
</html>
