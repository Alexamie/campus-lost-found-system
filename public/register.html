<!DOCTYPE html>
<html>
<head>

<title>Register</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="styles.css">

</head>

<body class="auth-page">

<main class="auth-shell">

<section class="auth-card">

<div class="auth-header">
<p class="auth-eyebrow">Campus Lost &amp; Found</p>
<h1 class="brand-title">Create account</h1>
<p class="auth-subtitle">Join the community and make it easier to return lost items to the right people.</p>
</div>

<form id="registerForm" class="auth-form">

<div class="mb-3">
<label for="fullName" class="form-label">Full Name</label>
<input type="text" id="fullName" class="form-control auth-input" placeholder="Enter your full name" required>
</div>

<div class="mb-3">
<label for="registerEmail" class="form-label">Email</label>
<input type="email" id="registerEmail" class="form-control auth-input" placeholder="Enter your email" required>
</div>

<div class="mb-3">
<label for="registerPassword" class="form-label">Password</label>
<input type="password" id="registerPassword" class="form-control auth-input" placeholder="Create a password" required>
</div>

<div class="mb-3">
<label for="confirmPassword" class="form-label">Confirm Password</label>
<input type="password" id="confirmPassword" class="form-control auth-input" placeholder="Confirm password" required>
</div>

<button type="submit" class="btn btn-coral w-100 auth-button">Register</button>

<p id="registerMsg" style="margin-top:10px;color:red;text-align:center;"></p>

<p class="auth-switch text-center">
Already have an account?
<a href="login.html" class="link-style">Login</a>
</p>

<p class="auth-switch text-center mb-0">
<a href="index.html" class="link-style">Back to Home</a>
</p>

</form>

</section>

</main>

<script src="script.js"></script>
</body>
</html>
