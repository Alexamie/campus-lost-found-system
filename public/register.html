<!DOCTYPE html>
<html>
<head>

<title>Register</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="styles.css">

</head>

<body>

<div class="container d-flex justify-content-center align-items-center vh-100">

<div class="card shadow p-4 auth-card" style="width:400px">

<h4 class="text-center brand-title mb-2">🎒 Campus Lost & Found</h4>

<h3 class="text-center mb-4">Create Account</h3>

<form id="registerForm">

<div class="mb-3">
<label class="form-label">Full Name</label>
<input type="text" id="fullName" class="form-control" placeholder="Enter your full name" required>
</div>

<div class="mb-3">
<label class="form-label">Email</label>
<input type="email" id="registerEmail" class="form-control" placeholder="Enter your email" required>
</div>

<div class="mb-3">
<label class="form-label">Password</label>
<input type="password" id="registerPassword" class="form-control" placeholder="Create a password" required>
</div>

<div class="mb-3">
<label class="form-label">Confirm Password</label>
<input type="password" id="confirmPassword" class="form-control" placeholder="Confirm password" required>
</div>

<button type="submit" class="btn btn-coral w-100">Register</button>

<p class="text-center mt-3">
Already have an account?
<a href="login.html" class="link-style">Login</a>
</p>

<p class="text-center">
<a href="index.html" class="link-style">Back to Home</a>
</p>

</form>

</div>

</div>

<script src="script.js"></script>
</body>
</html>
