<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<title>Report Item</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="styles.css">

</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container">
    <a class="navbar-brand" href="index.html">🎒 Campus Lost & Found</a>
  </div>
</nav>

<div class="container page-container my-5">

  <h2 class="mb-4">Report Lost or Found Item</h2>

  <form id="reportForm" class="shadow p-4 rounded bg-light">

    <div class="mb-3">
      <label for="itemName" class="form-label">Item Name</label>
      <input type="text" id="itemName" class="form-control" placeholder="e.g. Wallet, Phone" required>
    </div>

    <div class="mb-3">
      <label for="itemDescription" class="form-label">Description</label>
      <textarea id="itemDescription" class="form-control" rows="4" placeholder="Describe the item" required></textarea>
    </div>

    <div class="mb-3">
      <label for="itemCategory" class="form-label">Category</label>
      <select id="itemCategory" class="form-select" required>
        <option value="" selected disabled>Select category</option>
        <option value="lost">Lost</option>
        <option value="found">Found</option>
      </select>
    </div>

    <div class="mb-3">
      <label for="itemDate" class="form-label">Date</label>
      <input type="date" id="itemDate" class="form-control" required>
    </div>

    <div class="mb-3">
      <label for="itemLocation" class="form-label">Location</label>
      <input type="text" id="itemLocation" class="form-control" placeholder="Where was it lost/found?" required>
    </div>

    <div class="mb-3">
      <label for="contactInfo" class="form-label">Contact Information</label>
      <input type="text" id="contactInfo" class="form-control" placeholder="Your phone or email" required>
    </div>

    <button type="submit" class="btn btn-warning">Submit Report</button>

  </form>

</div>

<script src="script.js"></script>

</body>
</html>
