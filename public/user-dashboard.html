<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>User Dashboard - Campus Lost & Found</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
<link rel="stylesheet" href="styles.css">
<style>
/* Custom styles for sidebar dashboard */
.dashboard-container {
  display: flex;
  min-height: 100vh;
  background: linear-gradient(135deg, #fff8f5 0%, #ffe2d8 100%);
}

.sidebar {
  width: 280px;
  background: rgba(255, 255, 255, 0.95);
  border-right: 1px solid rgba(255, 111, 97, 0.1);
  padding: 24px;
  position: fixed;
  height: 100vh;
  overflow-y: auto;
  box-shadow: 2px 0 10px rgba(0,0,0,0.05);
}

.sidebar-header {
  text-align: center;
  margin-bottom: 32px;
  padding-bottom: 20px;
  border-bottom: 1px solid rgba(255, 111, 97, 0.1);
}

.sidebar-header .brand-title {
  color: #ff6f61;
  font-size: 1.5rem;
  font-weight: 700;
  margin-bottom: 4px;
}

.sidebar-header .user-info {
  color: #666;
  font-size: 0.9rem;
}

.nav-menu {
  list-style: none;
  padding: 0;
  margin: 0;
}

.nav-item {
  margin-bottom: 8px;
}

.nav-link {
  display: flex;
  align-items: center;
  padding: 12px 16px;
  color: #666;
  text-decoration: none;
  border-radius: 12px;
  transition: all 0.3s ease;
  font-weight: 500;
}

.nav-link:hover, .nav-link.active {
  background: linear-gradient(135deg, #ff9a7f, #ff6f61);
  color: white;
}

.nav-link i {
  margin-right: 12px;
  width: 20px;
}

.main-content {
  flex: 1;
  margin-left: 280px;
  padding: 24px;
}

.dashboard-header {
  background: rgba(255, 255, 255, 0.95);
  border-radius: 16px;
  padding: 24px;
  margin-bottom: 24px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.05);
}

.welcome-section h1 {
  color: #2f2830;
  margin-bottom: 8px;
  font-size: 2rem;
}

.welcome-section p {
  color: #666;
  margin: 0;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 20px;
  margin-bottom: 24px;
}

.stat-card {
  background: rgba(255, 255, 255, 0.95);
  border-radius: 16px;
  padding: 24px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.05);
  border-left: 4px solid #ff6f61;
  transition: transform 0.3s ease;
}

.stat-card:hover {
  transform: translateY(-2px);
}

.stat-card .stat-icon {
  font-size: 2rem;
  color: #ff6f61;
  margin-bottom: 12px;
}

.stat-card .stat-value {
  font-size: 2.5rem;
  font-weight: 700;
  color: #2f2830;
  margin-bottom: 4px;
}

.stat-card .stat-label {
  color: #666;
  font-size: 0.9rem;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.content-grid {
  display: grid;
  grid-template-columns: 1fr 400px;
  gap: 24px;
}

.main-panel {
  background: rgba(255, 255, 255, 0.95);
  border-radius: 16px;
  padding: 24px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.05);
}

.panel-header {
  display: flex;
  justify-content: between;
  align-items: center;
  margin-bottom: 20px;
}

.panel-header h3 {
  margin: 0;
  color: #2f2830;
  font-size: 1.5rem;
}

.sidebar-panel {
  background: rgba(255, 255, 255, 0.95);
  border-radius: 16px;
  padding: 24px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.05);
  height: fit-content;
}

.form-group {
  margin-bottom: 20px;
}

.form-group label {
  display: block;
  margin-bottom: 8px;
  color: #2f2830;
  font-weight: 600;
}

.form-control {
  width: 100%;
  padding: 12px;
  border: 1px solid #e0e0e0;
  border-radius: 8px;
  font-size: 0.9rem;
  transition: border-color 0.3s ease;
}

.form-control:focus {
  outline: none;
  border-color: #ff6f61;
  box-shadow: 0 0 0 2px rgba(255, 111, 97, 0.1);
}

.btn-primary {
  background: linear-gradient(135deg, #ff9a7f, #ff6f61);
  border: none;
  padding: 12px 24px;
  border-radius: 8px;
  color: white;
  font-weight: 600;
  cursor: pointer;
  transition: transform 0.3s ease;
}

.btn-primary:hover {
  transform: translateY(-1px);
  box-shadow: 0 4px 12px rgba(255, 111, 97, 0.3);
}

.table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 20px;
}

.table th, .table td {
  padding: 12px;
  text-align: left;
  border-bottom: 1px solid #e0e0e0;
}

.table th {
  background: #f8f9fa;
  font-weight: 600;
  color: #2f2830;
}

.status-badge {
  padding: 4px 8px;
  border-radius: 12px;
  font-size: 0.8rem;
  font-weight: 600;
  text-transform: uppercase;
}

.status-lost {
  background: #fee;
  color: #d63384;
}

.status-found {
  background: #efe;
  color: #198754;
}

.status-approved {
  background: #e7f3ff;
  color: #0d6efd;
}

.status-pending {
  background: #fff3cd;
  color: #856404;
}

.recent-activity {
  margin-top: 24px;
}

.activity-item {
  display: flex;
  align-items: center;
  padding: 12px 0;
  border-bottom: 1px solid #e0e0e0;
}

.activity-item:last-child {
  border-bottom: none;
}

.activity-icon {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: #ff6f61;
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-right: 12px;
  font-size: 0.8rem;
}

.activity-content {
  flex: 1;
}

.activity-content .title {
  font-weight: 600;
  color: #2f2830;
  margin-bottom: 2px;
}

.activity-content .meta {
  font-size: 0.8rem;
  color: #666;
}

@media (max-width: 768px) {
  .sidebar {
    width: 100%;
    position: relative;
    height: auto;
  }

  .main-content {
    margin-left: 0;
  }

  .content-grid {
    grid-template-columns: 1fr;
  }

  .stats-grid {
    grid-template-columns: repeat(2, 1fr);
  }
}
</style>
</head>

<body>
<div class="dashboard-container">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <h2 class="brand-title">Campus Lost & Found</h2>
      <div class="user-info" id="sidebarUserInfo">Loading...</div>
    </div>

    <nav>
      <ul class="nav-menu">
        <li class="nav-item">
          <a href="#dashboard" class="nav-link active">
            <i class="bi bi-house-door"></i>
            Dashboard
          </a>
        </li>
        <li class="nav-item">
          <a href="#reports" class="nav-link">
            <i class="bi bi-file-earmark-text"></i>
            My Reports
          </a>
        </li>
        <li class="nav-item">
          <a href="#submit" class="nav-link">
            <i class="bi bi-plus-circle"></i>
            Submit Report
          </a>
        </li>
        <li class="nav-item">
          <a href="#search" class="nav-link">
            <i class="bi bi-search"></i>
            Search Items
          </a>
        </li>
        <li class="nav-item">
          <a href="profile.html" class="nav-link">
            <i class="bi bi-person"></i>
            Profile
          </a>
        </li>
        <li class="nav-item">
          <a href="index.html" class="nav-link">
            <i class="bi bi-globe"></i>
            Campus Home
          </a>
        </li>
        <li class="nav-item">
          <button class="nav-link" onclick="logout()" style="width: 100%; border: none; background: none; text-align: left;">
            <i class="bi bi-box-arrow-right"></i>
            Logout
          </button>
        </li>
      </ul>
    </nav>
  </aside>

  <!-- Main Content -->
  <main class="main-content">
    <!-- Header -->
    <header class="dashboard-header">
      <div class="welcome-section">
        <h1 id="welcomeTitle">Welcome back!</h1>
        <p id="welcomeSubtitle">Manage your lost and found reports on campus</p>
      </div>
    </header>

    <!-- Stats Cards -->
    <section class="stats-grid">
      <div class="stat-card">
        <div class="stat-icon">
          <i class="bi bi-file-earmark-text"></i>
        </div>
        <div class="stat-value" id="statReports">0</div>
        <div class="stat-label">Total Reports</div>
      </div>

      <div class="stat-card">
        <div class="stat-icon">
          <i class="bi bi-check-circle"></i>
        </div>
        <div class="stat-value" id="statApprovedReports">0</div>
        <div class="stat-label">Approved</div>
      </div>

      <div class="stat-card">
        <div class="stat-icon">
          <i class="bi bi-clock"></i>
        </div>
        <div class="stat-value" id="statPendingReports">0</div>
        <div class="stat-label">Pending</div>
      </div>

      <div class="stat-card">
        <div class="stat-icon">
          <i class="bi bi-hand-thumbs-up"></i>
        </div>
        <div class="stat-value" id="statResolved">0</div>
        <div class="stat-label">Resolved</div>
      </div>
    </section>

    <!-- Main Content Grid -->
    <div class="content-grid">
      <!-- Main Panel -->
      <div class="main-panel">
        <!-- Reports Table -->
        <div id="reportsSection">
          <div class="panel-header">
            <h3>My Reports</h3>
            <div>
              <input type="text" id="searchReports" class="form-control" placeholder="Search reports..." style="width: 200px; display: inline-block; margin-right: 10px;">
              <select id="filterStatus" class="form-control" style="width: 120px; display: inline-block;">
                <option value="">All Status</option>
                <option value="approved">Approved</option>
                <option value="pending">Pending</option>
                <option value="rejected">Rejected</option>
              </select>
            </div>
          </div>
          <div id="myReportsTable"></div>
        </div>

        <!-- Submit Report Form -->
        <div id="submitSection" style="display: none;">
          <div class="panel-header">
            <h3>Submit New Report</h3>
          </div>
          <form id="dashboardReportForm">
            <div class="form-group">
              <label for="dashboardItemName">Item Title *</label>
              <input type="text" id="dashboardItemName" class="form-control" placeholder="e.g., Blue Backpack, iPhone 12" required>
            </div>

            <div class="form-group">
              <label for="dashboardItemDescription">Description *</label>
              <textarea id="dashboardItemDescription" class="form-control" rows="3" placeholder="Describe the item, color, brand, distinguishing features..." required></textarea>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
              <div class="form-group">
                <label for="dashboardItemStatus">Report Type *</label>
                <select id="dashboardItemStatus" class="form-control" required>
                  <option value="">Select Type</option>
                  <option value="lost">I Lost This Item</option>
                  <option value="found">I Found This Item</option>
                </select>
              </div>

              <div class="form-group">
                <label for="dashboardItemLocation">Location *</label>
                <select id="dashboardItemLocation" class="form-control" required>
                  <option value="">Select Location</option>
                  <option value="library">Library</option>
                  <option value="cafeteria">Cafeteria</option>
                  <option value="dormitory">Dormitory</option>
                  <option value="classroom">Classroom</option>
                  <option value="parking">Parking Lot</option>
                  <option value="gym">Gym</option>
                  <option value="student-center">Student Center</option>
                  <option value="other">Other</option>
                </select>
              </div>
            </div>

            <div class="form-group">
              <label for="dashboardItemContact">Contact Information *</label>
              <input type="text" id="dashboardItemContact" class="form-control" placeholder="Phone number or email for coordination" required>
            </div>

            <button type="submit" class="btn-primary">Submit Report</button>
          </form>
        </div>
      </div>

      <!-- Sidebar Panel -->
      <div class="sidebar-panel">
        <!-- Quick Actions -->
        <div style="margin-bottom: 24px;">
          <h4 style="margin-bottom: 16px; color: #2f2830;">Quick Actions</h4>
          <button class="btn-primary" style="width: 100%; margin-bottom: 8px;" onclick="showSubmitForm()">Submit New Report</button>
          <button class="btn-primary" style="width: 100%; background: #28a745;" onclick="showReports()">View My Reports</button>
        </div>


      </div>
    </div>
  </main>
</div>

<script>
// Check for session using the same format as script.js
const session = JSON.parse(localStorage.getItem("session"));
const user = session?.user;

if (!user) {
  window.location.href = "login.html";
}
</script>

<script src="script.js"></script>
<script>
// Custom dashboard functions
function showSubmitForm() {
  document.getElementById('reportsSection').style.display = 'none';
  document.getElementById('submitSection').style.display = 'block';

  // Update active nav
  document.querySelectorAll('.nav-link').forEach(link => link.classList.remove('active'));
  document.querySelector('a[href="#submit"]').classList.add('active');
}

function showReports() {
  document.getElementById('reportsSection').style.display = 'block';
  document.getElementById('submitSection').style.display = 'none';

  // Update active nav
  document.querySelectorAll('.nav-link').forEach(link => link.classList.remove('active'));
  document.querySelector('a[href="#reports"]').classList.add('active');
}

// Enhanced render function
function renderUserDashboard(dashboard) {
  const user = dashboard.user;
  const reports = dashboard.reports || [];
  const approvedReports = reports.filter(report => report.approvalStatus === 'approved');
  const pendingReports = reports.filter(report => report.approvalStatus === 'pending');
  const resolvedReports = reports.filter(report => report.status === 'resolved');

  // Update sidebar user info
  document.getElementById('sidebarUserInfo').textContent = `${user.name}`;

  // Update welcome message
  document.getElementById('welcomeTitle').textContent = `Welcome back, ${user.name}!`;
  document.getElementById('welcomeSubtitle').textContent = 'Manage your lost and found reports on campus';

  // Update stats
  document.getElementById('statReports').textContent = reports.length;
  document.getElementById('statApprovedReports').textContent = approvedReports.length;
  document.getElementById('statPendingReports').textContent = pendingReports.length;
  document.getElementById('statResolved').textContent = resolvedReports.length;

  // Render reports table with enhanced features
  renderReportsTable('myReportsTable', reports);
}

// Enhanced table rendering with status badges
function renderReportsTable(containerId, items) {
  const container = document.getElementById(containerId);
  if (!container) return;

  if (!items.length) {
    container.innerHTML = `
      <div style="text-align: center; padding: 40px; color: #666;">
        <i class="bi bi-file-earmark-x" style="font-size: 3rem; margin-bottom: 16px;"></i>
        <h4>No reports found</h4>
        <p>Submit your first lost or found report to get started!</p>
        <button class="btn-primary" onclick="showSubmitForm()">Submit Report</button>
      </div>
    `;
    return;
  }

  const rows = items
    .map((item) => {
      const statusClass = item.status === 'lost' ? 'status-lost' : 'status-found';
      const approvalClass = item.approvalStatus === 'approved' ? 'status-approved' :
                           item.approvalStatus === 'pending' ? 'status-pending' : 'status-rejected';

      return `
        <tr>
          <td>
            <strong>${escapeHtml(item.title)}</strong>
            <br><small style="color: #666;">${escapeHtml(item.description.substring(0, 50))}...</small>
          </td>
          <td><span class="status-badge ${statusClass}">${escapeHtml(item.status)}</span></td>
          <td>${escapeHtml(item.location)}</td>
          <td><span class="status-badge ${approvalClass}">${escapeHtml(item.approvalStatus)}</span></td>
          <td>${formatDate(item.createdAt)}</td>
        </tr>
      `;
    })
    .join('');

  container.innerHTML = `
    <div class="table-responsive">
      <table class="table">
        <thead>
          <tr>
            <th>Item Details</th>
            <th>Type</th>
            <th>Location</th>
            <th>Status</th>
            <th>Submitted</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  `;
}

// Add search and filter functionality
document.addEventListener('DOMContentLoaded', function() {
  const searchInput = document.getElementById('searchReports');
  const filterSelect = document.getElementById('filterStatus');

  if (searchInput) {
    searchInput.addEventListener('input', filterReports);
  }

  if (filterSelect) {
    filterSelect.addEventListener('change', filterReports);
  }

  // Navigation handling
  document.querySelectorAll('.nav-link').forEach(link => {
    link.addEventListener('click', function(e) {
      if (this.getAttribute('href').startsWith('#')) {
        e.preventDefault();
        const target = this.getAttribute('href').substring(1);

        document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
        this.classList.add('active');

        if (target === 'submit') {
          showSubmitForm();
        } else if (target === 'reports') {
          showReports();
        }
      }
    });
  });
});

function filterReports() {
  const searchTerm = document.getElementById('searchReports').value.toLowerCase();
  const statusFilter = document.getElementById('filterStatus').value;
  const rows = document.querySelectorAll('#myReportsTable tbody tr');

  rows.forEach(row => {
    const title = row.cells[0].textContent.toLowerCase();
    const status = row.cells[3].textContent.toLowerCase();

    const matchesSearch = title.includes(searchTerm);
    const matchesFilter = !statusFilter || status.includes(statusFilter);

    row.style.display = matchesSearch && matchesFilter ? '' : 'none';
  });
}
</script>
</body>
</html>
</html>
