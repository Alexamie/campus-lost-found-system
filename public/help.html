<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Contact / Help</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container">
    <a class="navbar-brand" href="index.html">🎒 Campus Lost & Found</a>
  </div>
</nav>

<div class="container page-container my-5">
  <h2 class="mb-4">Contact & Help</h2>

  <div class="row">
    <div class="col-md-6">
      <div class="card shadow mb-4">
        <div class="card-body">
          <h5 class="card-title">Campus Support</h5>
          <p class="card-text">Need help with the app, finding an item, or connecting with campus support?</p>
          <ul class="list-unstyled">
            <li><strong>Phone:</strong> (555) 123-4567</li>
            <li><strong>Email:</strong> support@campuslostfound.edu</li>
            <li><strong>Office:</strong> Student Center, USC</li>
          </ul>
        </div>
      </div>
    </div>

    <div class="col-md-6">
      <div class="card shadow">
        <div class="card-body">
          <h5 class="card-title">Send Us a Message</h5>
          <form id="contactForm">
            <div class="mb-3">
              <label for="contactName" class="form-label">Name</label>
              <input type="text" class="form-control" id="contactName" required>
            </div>
            <div class="mb-3">
              <label for="contactEmail" class="form-label">Email</label>
              <input type="email" class="form-control" id="contactEmail" required>
            </div>
            <div class="mb-3">
              <label for="contactMessage" class="form-label">Message</label>
              <textarea class="form-control" id="contactMessage" rows="4" required></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Send Message</button>
            <div id="contactSuccess" class="mt-3 alert alert-success" style="display:none;" role="alert">
              Thanks! Your message has been submitted.
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
