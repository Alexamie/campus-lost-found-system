<!DOCTYPE html>
<html>
<head>

<title>Login</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="styles.css">

</head>

<body>

<div class="container d-flex justify-content-center align-items-center vh-100">

<div class="card shadow p-4 auth-card" style="width:350px">

<h4 class="text-center brand-title mb-2">🎒 Campus Lost & Found</h4>

<h3 class="text-center mb-4">Login</h3>

<form id="loginForm">

<div class="mb-3">
<label>Email</label>
<input type="email" id="email" class="form-control" placeholder="Enter your email" required>
</div>

<div class="mb-3">
<label>Password</label>
<input type="password" id="password" class="form-control" placeholder="Enter your password" required>
</div>

<button type="submit" class="btn btn-coral w-100">Login</button>

<p class="text-center mt-3">
<a href="register.html" class="link-style">Create Account</a>
</p>

</form>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
