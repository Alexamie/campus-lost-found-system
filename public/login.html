<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>

<body class="auth-page">

<main class="auth-shell">

<section class="auth-card">

<div class="auth-header">
<p class="auth-eyebrow">Campus Lost & Found</p>
<h1 class="brand-title" id="authTitle">Welcome back</h1>
<p class="auth-subtitle" id="authSubtitle">Sign in to manage reports and track lost items.</p>
</div>

<form id="loginForm" class="auth-form">

<div class="mb-3">
<label>Email</label>
<input type="email" id="email" class="form-control" required>
</div>

<div class="mb-3">
<label>Password</label>
<input type="password" id="password" class="form-control" required>
</div>

<button type="submit" id="loginSubmitBtn" class="btn btn-primary w-100">
Login
</button>

<p id="msg" style="margin-top:10px;color:red;text-align:center;"></p>

<p class="text-center mt-3">
<a href="#" id="showRegisterLink">Create Account</a>
</p>

</form>

<!-- Registration Form (Hidden by default) -->
<form id="registerForm" class="auth-form" style="display: none;">

<div class="mb-3">
<label for="fullName" class="form-label">Full Name</label>
<input type="text" id="fullName" class="form-control auth-input" placeholder="Enter your full name" required>
</div>

<div class="mb-3">
<label for="registerEmail" class="form-label">Email</label>
<input type="email" id="registerEmail" class="form-control auth-input" placeholder="Enter your email" required>
</div>

<div class="mb-3">
<label for="registerPassword" class="form-label">Password</label>
<input type="password" id="registerPassword" class="form-control auth-input" placeholder="Create a password" required>
</div>

<div class="mb-3">
<label for="confirmPassword" class="form-label">Confirm Password</label>
<input type="password" id="confirmPassword" class="form-control auth-input" placeholder="Confirm password" required>
</div>

<button type="submit" class="btn btn-coral w-100 auth-button">Register</button>

<p id="registerMsg" style="margin-top:10px;color:red;text-align:center;"></p>

<p class="text-center mt-3">
<a href="#" id="showLoginLink">Already have an account? Login</a>
</p>

</form>

</section>

</main>

<script src="script.js"></script>

<script>
// Form switching functionality
document.addEventListener('DOMContentLoaded', function() {
  const showRegisterLink = document.getElementById('showRegisterLink');
  const showLoginLink = document.getElementById('showLoginLink');
  const loginForm = document.getElementById('loginForm');
  const registerForm = document.getElementById('registerForm');
  const authTitle = document.getElementById('authTitle');
  const authSubtitle = document.getElementById('authSubtitle');

  // Show register form
  showRegisterLink.addEventListener('click', function(e) {
    e.preventDefault();
    loginForm.style.display = 'none';
    registerForm.style.display = 'block';
    authTitle.textContent = 'Create account';
    authSubtitle.textContent = 'Join the community and make it easier to return lost items to the right people.';
  });

  // Show login form
  showLoginLink.addEventListener('click', function(e) {
    e.preventDefault();
    registerForm.style.display = 'none';
    loginForm.style.display = 'block';
    authTitle.textContent = 'Welcome back';
    authSubtitle.textContent = 'Sign in to manage reports and track lost items.';
  });
});
</script>
</body>
</html>
